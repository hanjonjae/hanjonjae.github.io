# 대표님 블로그(kgc7215) 새 글을 하루 두 번 받아와 홈페이지 '한존재 소식'에 반영
# + 매달 1일에는 '확인함' 기록을 남겨, 블로그를 오래 쉬어도 GitHub가 자동 실행을 끄지 않게 함
#   (GitHub는 저장소에 60일간 변화가 없으면 예약 실행을 멈춤)
name: 한존재 소식 갱신

on:
  schedule:
    - cron: "0 23 * * *"   # 한국시간 오전 8시
    - cron: "0 11 * * *"   # 한국시간 오후 8시
    - cron: "0 1 1 * *"    # 매달 1일 한국시간 오전 10시 — 출석 체크
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능
    inputs:
      keepalive:
        description: "출석 체크 기록도 남기기"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 블로그 글 받아오기
        run: python3 tools/update_news.py
      - name: 매달 출석 체크 기록
        if: github.event.schedule == '0 1 1 * *' || inputs.keepalive
        run: TZ=Asia/Seoul date "+%Y.%m.%d %H:%M 확인함" > .github/last-check.txt
      - name: 바뀐 게 있으면 저장
        run: |
          git add assets/data/news.json .github/last-check.txt
          if git diff --cached --quiet; then
            echo "새 글 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "한존재 소식 자동 갱신"
          git push
