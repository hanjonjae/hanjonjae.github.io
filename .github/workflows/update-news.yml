# 대표님 블로그(kgc7215) 새 글을 하루 두 번 받아와 홈페이지 '한존재 소식'에 반영
name: 한존재 소식 갱신

on:
  schedule:
    - cron: "0 23 * * *"   # 한국시간 오전 8시
    - cron: "0 11 * * *"   # 한국시간 오후 8시
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 블로그 글 받아오기
        run: python3 tools/update_news.py
      - name: 바뀐 게 있으면 저장
        run: |
          if git diff --quiet -- assets/data/news.json; then
            echo "새 글 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/data/news.json
          git commit -m "한존재 소식 자동 갱신"
          git push
